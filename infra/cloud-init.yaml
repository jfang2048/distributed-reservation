#cloud-config
ssh_pwauth: false
disable_root: true

users:
  - name: lab
    shell: /bin/bash
    lock_passwd: true
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
      - '@PUBLIC_KEY@'
  - name: reservation
    system: true
    shell: /usr/sbin/nologin
    lock_passwd: true

package_update: true
packages:
  - openjdk-17-jre-headless
  - iproute2
  - nftables

write_files:
  - path: /etc/reservation-lab
    permissions: '0644'
    content: |
      @NODE@
